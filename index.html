<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>खबर नेपाली सेवा</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f7f8;
  color:#222;
}

.top{
  background:#087f3f;
  color:white;
  padding:8px 5%;
  font-size:14px;
}

.header{
  background:white;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:38px;
  font-weight:bold;
  color:#087f3f;
}

.logo span{
  color:#d71920;
}

.tagline{
  color:#1267a5;
  margin-top:5px;
}

.clock{
  font-weight:bold;
  color:#087f3f;
}

nav{
  background:#087f3f;
  display:flex;
  flex-wrap:wrap;
  padding:0 5%;
}

nav a{
  color:white;
  text-decoration:none;
  padding:14px 17px;
  font-weight:bold;
}

nav a:hover{
  background:#d71920;
}

.container{
  width:90%;
  max-width:1200px;
  margin:25px auto;
}

.breaking{
  background:#d71920;
  color:white;
  padding:12px 15px;
  border-radius:5px;
  margin-bottom:25px;
  font-weight:bold;
}

.title{
  font-size:30px;
  color:#087f3f;
  border-left:6px solid #d71920;
  padding-left:12px;
  margin:30px 0 20px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.news-card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  transition:.2s;
}

.news-card:hover{
  transform:translateY(-3px);
}

.news-card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.news-body{
  padding:16px;
}

.category{
  color:#d71920;
  font-size:14px;
  font-weight:bold;
}

.news-card h2{
  font-size:21px;
  margin:8px 0;
  line-height:1.5;
}

.news-card p{
  color:#555;
  line-height:1.7;
}

.meta{
  font-size:13px;
  color:#777;
  margin-top:12px;
}

.read{
  display:inline-block;
  background:#087f3f;
  color:white;
  padding:8px 14px;
  border-radius:5px;
  text-decoration:none;
  margin-top:10px;
}

.loading{
  text-align:center;
  padding:40px;
  font-size:20px;
}

.error{
  background:#ffe0e0;
  color:#b00000;
  padding:15px;
  border-radius:6px;
}

.empty{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:10px;
}

footer{
  margin-top:50px;
  background:#087f3f;
  color:white;
  padding:30px 5%;
  text-align:center;
}

@media(max-width:800px){
  .header{
    flex-direction:column;
    text-align:center;
  }

  .logo{
    font-size:30px;
  }

  .news-grid{
    grid-template-columns:1fr;
  }

  nav a{
    padding:10px 12px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="top">
  आजको समाचार | खबर नेपाली सेवा
</div>

<header class="header">

  <div>
    <div class="logo">
      खबर <span>नेपाली सेवा</span>
    </div>

    <div class="tagline">
      सत्य, तथ्य र निष्पक्ष समाचार
    </div>
  </div>

  <div class="clock" id="clock"></div>

</header>

<nav>
  <a href="index.html">गृहपृष्ठ</a>
  <a href="index.html?page=politics">राजनीति</a>
  <a href="index.html?page=economy">अर्थतन्त्र</a>
  <a href="index.html?page=society">समाज</a>
  <a href="index.html?page=culture">कला/संस्कृति</a>
  <a href="index.html?page=sports">खेलकुद</a>
  <a href="index.html?page=technology">प्रविधि</a>
  <a href="index.html?page=global">विश्व</a>
</nav>

<main class="container">

  <div class="breaking">
    🔴 ब्रेकिङ समाचार : खबर नेपाली सेवामा स्वागत छ
  </div>

  <h1 class="title">
    📰 पछिल्ला समाचार
  </h1>

  <div id="newsContainer" class="news-grid">
    <div class="loading">
      समाचार लोड हुँदैछ...
    </div>
  </div>

</main>

<footer>
  <h2>खबर नेपाली सेवा</h2>
  <p>सत्य, तथ्य र निष्पक्ष समाचार</p>
  <p>© २०८३ खबर नेपाली सेवा</p>
</footer>

<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"https://wrilgmjnoyqvwaohljut.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Xd-dyWiHHjnd9bbE1sZuxw_TRYuX4H3";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   CLOCK
================================ */

function updateClock(){

  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleString("ne-NP",{
      dateStyle:"medium",
      timeStyle:"medium"
    });

}

updateClock();

setInterval(updateClock,1000);


/* ================================
   LOAD NEWS
================================ */

async function loadNews(){

  const container =
    document.getElementById("newsContainer");

  container.innerHTML =
    '<div class="loading">समाचार लोड हुँदैछ...</div>';

  const { data, error } =
    await supabaseClient
      .from("news")
      .select("*")
      .eq("published",true)
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="error">
        समाचार लोड गर्न समस्या भयो।
        <br>
        ${error.message}
      </div>
    `;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty">
        <h2>अहिले कुनै समाचार प्रकाशित भएको छैन।</h2>
        <p>Admin Panel बाट पहिलो समाचार Publish गर्नुहोस्।</p>
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(news => {

    const card =
      document.createElement("article");

    card.className = "news-card";


    const image =
      news.image_url
      ? `<img src="${news.image_url}" alt="${escapeHtml(news.title)}">`
      : "";


    const content =
      news.content
      ? news.content.substring(0,180) + "..."
      : "";


    card.innerHTML = `

      ${image}

      <div class="news-body">

        <div class="category">
          ${escapeHtml(news.category || "समाचार")}
        </div>

        <h2>
          ${escapeHtml(news.title)}
        </h2>

        <p>
          ${escapeHtml(content)}
        </p>

        <div class="meta">
          ✍️ ${escapeHtml(news.author || "खबर नेपाली सेवा")}
        </div>

        <div class="meta">
          🕐 ${formatDate(news.created_at)}
        </div>

        <a
          class="read"
          href="javascript:void(0)"
          onclick="showNews(${news.id})"
        >
          पूरा समाचार पढ्नुहोस् →
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}


/* ================================
   FULL NEWS
================================ */

async function showNews(id){

  const { data, error } =
    await supabaseClient
      .from("news")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert("समाचार खोल्न समस्या भयो।");

    return;
  }


  const container =
    document.getElementById("newsContainer");


  container.innerHTML = `

    <article class="news-card"
      style="grid-column:1/-1">

      ${
        data.image_url
        ? `<img
            src="${data.image_url}"
            style="height:auto;max-height:600px"
            alt="${escapeHtml(data.title)}"
          >`
        : ""
      }

      <div class="news-body">

        <div class="category">
          ${escapeHtml(data.category || "समाचार")}
        </div>

        <h1>
          ${escapeHtml(data.title)}
        </h1>

        <div class="meta">
          ✍️ ${escapeHtml(data.author || "खबर नेपाली सेवा")}
        </div>

        <div class="meta">
          🕐 ${formatDate(data.created_at)}
        </div>

        <hr>

        <p style="
          white-space:pre-line;
          font-size:18px;
          line-height:2;
        ">
          ${escapeHtml(data.content || "")}
        </p>

        <button
          onclick="loadNews()"
          style="
            background:#087f3f;
            color:white;
            border:0;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
          "
        >
          ← सबै समाचार
        </button>

      </div>

    </article>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   DATE
================================ */

function formatDate(date){

  if(!date) return "";

  return new Date(date).toLocaleString(
    "ne-NP",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* ================================
   SECURITY
================================ */

function escapeHtml(text){

  if(text === null || text === undefined){
    return "";
  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   START
================================ */

loadNews();

</script>

</body>
</html>
