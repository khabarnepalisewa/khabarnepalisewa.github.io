<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f3f">
<title>Admin Panel | खबर नेपाली सेवा</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-874WW7ZMBD"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-874WW7ZMBD');
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,"Noto Sans Devanagari",sans-serif}header{background:#087f3f;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:22px;margin:0}header a{color:white}.container{max-width:1000px;margin:28px auto;padding:0 15px}.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 12px #0000000d;margin-bottom:22px}h2{margin-top:0;color:#087f3f}label{display:block;margin:16px 0 7px;font-weight:bold}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font:inherit}textarea{min-height:220px;resize:vertical}button,.btn{border:0;background:#087f3f;color:white;padding:12px 18px;border-radius:7px;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.6;cursor:wait}.secondary{background:#59665d}.login{max-width:460px;margin:65px auto}.hidden{display:none!important}.message{margin-top:14px;padding:12px;border-radius:6px;white-space:pre-wrap}.success{background:#d9f7e5;color:#126b35}.error{background:#ffe1e1;color:#a00000}.preview{margin-top:12px;max-width:300px;max-height:220px;object-fit:contain;display:none}.news-item{border:1px solid #ddd;padding:14px;border-radius:8px;margin-top:12px;overflow-wrap:anywhere}.news-item img{width:100px;height:75px;object-fit:cover;float:left;margin-right:12px}.small{color:#777;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.danger{background:#a51d24}
</style>
</head>
<body>
<div id="loginBox" class="login box">
<h2>🔐 Admin Login</h2>
<p>समाचार प्रकाशित गर्न आफ्नो Supabase account बाट लगइन गर्नुहोस्।</p>
<form id="loginForm">
<label for="email">इमेल</label><input type="email" id="email" autocomplete="username" required>
<label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required>
<p><button type="submit" id="loginBtn">Login</button></p>
</form>
<div id="loginMessage" class="message hidden"></div>
</div>
<div id="adminPanel" class="hidden">
<header><h1>📰 खबर नेपाली सेवा — Admin Panel</h1><div><a href="index.html">वेबसाइट</a> <button type="button" id="logoutBtn" class="secondary">Logout</button></div></header>
<main class="container">
<section class="box">
<h2>📝 नयाँ समाचार लेख्नुहोस्</h2>
<form id="newsForm">
<label for="title">समाचार शीर्षक *</label><input id="title" maxlength="250" required placeholder="समाचारको मुख्य शीर्षक">
<label for="category">श्रेणी *</label>
<select id="category" required>
<option value="">श्रेणी छान्नुहोस्</option>
<option value="समाचार">समाचार</option><option value="राजनीति">राजनीति</option>
<option value="अर्थतन्त्र">अर्थतन्त्र</option><option value="समाज">समाज</option>
<option value="कला/संस्कृति">कला/संस्कृति</option><option value="खेलकुद">खेलकुद</option>
<option value="प्रविधि">प्रविधि</option><option value="विश्व">विश्व</option><option value="फिचर">फिचर</option>
</select>
<label for="image">समाचारको फोटो *</label><input type="file" id="image" accept="image/jpeg,image/png,image/webp,image/gif" required>
<div class="small">JPG, PNG, WebP वा GIF; अधिकतम 5 MB।</div><img id="preview" class="preview" alt="फोटो preview">
<label for="content">समाचार लेख *</label><textarea id="content" required placeholder="यहाँ पूरा समाचार लेख्नुहोस्..."></textarea>
<label for="author">लेखक</label><input id="author" maxlength="120" value="खबर नेपाली सेवा">
<p><button type="submit" id="publishBtn">🚀 समाचार Publish गर्नुहोस्</button></p>
</form><div id="publishMessage" class="message hidden"></div>
</section>
<section class="box"><h2>📰 प्रकाशित समाचार</h2><button type="button" id="refreshBtn" class="secondary">Refresh</button><div id="newsList">समाचार लोड हुँदैछ...</div></section>
</main>
</div>
<script>
const SUPABASE_URL="https://wrilgmjnoyqvwaohljut.supabase.co";
const SUPABASE_KEY="sb_publishable_Xd-dyWiHHjnd9bbE1sZuxw_TRYuX4H3";
const BUCKET="news-images";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function message(el,text,ok){el.textContent=text;el.className="message "+(ok?"success":"error");el.classList.remove("hidden")}
function setLoggedIn(user){$("loginBox").classList.toggle("hidden",!!user);$("adminPanel").classList.toggle("hidden",!user)}
async function refreshSession(){const {data,error}=await supabaseClient.auth.getSession();if(error){message($("loginMessage"),error.message,false);return}setLoggedIn(data.session?.user||null);if(data.session?.user)await loadNews()}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();$("loginBtn").disabled=true;
 try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;setLoggedIn(data.user);await loadNews();message($("publishMessage"),"Login सफल भयो।",true)}
 catch(err){message($("loginMessage"),"Login असफल भयो: "+err.message,false)}
 finally{$("loginBtn").disabled=false}
});
$("logoutBtn").addEventListener("click",async()=>{const {error}=await supabaseClient.auth.signOut();if(error)alert("Logout भएन: "+error.message);else location.reload()});
$("image").addEventListener("change",()=>{
 const file=$("image").files[0],preview=$("preview");
 if(!file){preview.style.display="none";return}
 if(file.size>5*1024*1024){message($("publishMessage"),"फोटो 5 MB भन्दा सानो हुनुपर्छ।",false);$("image").value="";preview.style.display="none";return}
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){message($("publishMessage"),"JPG, PNG, WebP वा GIF फोटो मात्र छान्नुहोस्।",false);$("image").value="";preview.style.display="none";return}
 preview.src=URL.createObjectURL(file);preview.style.display="block";
});
$("newsForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const {data:sessionData}=await supabaseClient.auth.getSession();
 if(!sessionData.session){message($("publishMessage"),"पहिले Admin Login गर्नुहोस्।",false);setLoggedIn(null);return}
 const title=$("title").value.trim(),category=$("category").value,content=$("content").value.trim(),author=$("author").value.trim(),file=$("image").files[0],btn=$("publishBtn");
 if(!title||!category||!content||!file){message($("publishMessage"),"शीर्षक, श्रेणी, फोटो र समाचारको विवरण सबै भर्नुहोस्।",false);return}
 if(file.size>5*1024*1024){message($("publishMessage"),"फोटो 5 MB भन्दा सानो हुनुपर्छ।",false);return}
 btn.disabled=true;message($("publishMessage"),"समाचार Publish हुँदैछ...",true);
 let uploadedPath=null;
 try{
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  uploadedPath=Date.now()+"-"+crypto.randomUUID()+"."+ext;
  const {error:uploadError}=await supabaseClient.storage.from(BUCKET).upload(uploadedPath,file,{cacheControl:"3600",upsert:false,contentType:file.type});
  if(uploadError)throw new Error("फोटो upload भएन: "+uploadError.message);
  const {data:urlData}=supabaseClient.storage.from(BUCKET).getPublicUrl(uploadedPath);
  const {error:insertError}=await supabaseClient.from("news").insert([{title,category,image_url:urlData.publicUrl,content,author:author||"खबर नेपाली सेवा",published:true}]);
  if(insertError)throw new Error("समाचार save भएन: "+insertError.message);
  $("newsForm").reset();$("preview").style.display="none";
  message($("publishMessage"),"🎉 समाचार सफलतापूर्वक Publish भयो!",true);await loadNews();
 }catch(err){
  message($("publishMessage"),err.message||"त्रुटि भयो। Supabase policies जाँच गर्नुहोस्।",false);
 }finally{btn.disabled=false}
});
async function loadNews(){
 const {data:sessionData}=await supabaseClient.auth.getSession();if(!sessionData.session){$("newsList").textContent="सूची हेर्न Login गर्नुहोस्।";return}
 $("newsList").textContent="समाचार लोड हुँदैछ...";
 const {data,error}=await supabaseClient.from("news").select("id,title,category,image_url,content,author,created_at,published").order("created_at",{ascending:false}).limit(100);
 if(error){$("newsList").textContent="समाचार लोड भएन: "+error.message;return}
 if(!data?.length){$("newsList").textContent="अहिलेसम्म कुनै समाचार छैन।";return}
 $("newsList").innerHTML=data.map(n=>`<div class="news-item">${n.image_url?`<img src="${escapeHtml(n.image_url)}" alt="">`:""}<strong>${escapeHtml(n.title)}</strong><div class="small">${escapeHtml(n.category)} · ${n.published?"प्रकाशित":"Draft"} · ${escapeHtml(n.author||"")}</div><p>${escapeHtml(String(n.content||"").slice(0,160))}${String(n.content||"").length>160?"…":""}</p><div class="actions"><a class="btn" href="article.html?id=${encodeURIComponent(n.id)}" target="_blank">समाचार खोल्नुहोस्</a></div><div style="clear:both"></div></div>`).join("");
}
$("refreshBtn").addEventListener("click",loadNews);
supabaseClient.auth.onAuthStateChange((_event,session)=>{setLoggedIn(session?.user||null)});
refreshSession();
</script>
</body>
</html>
